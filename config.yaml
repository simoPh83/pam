# Planning Application Monitor — configuration
# CLI flags override anything set here (see: python -m pam --help)

home_postcode: N19 4HF          # recorded as distance_km on every row (never a filter)

# Areas to monitor. Borough-based (PlanIt `auth` param); the ledger dedupes any
# overlap. Postcode+radius areas remain supported if ever needed.
# Audit 2026-09.27: these boroughs have fresh PlanIt crawls (scraped daily).
# Barking & Dagenham is STALE (July) — excluded until the crawl recovers.
# Remaining ~23 London boroughs: audit pending rate-limit reset, add after.
areas:
  # First live backfill (2026-09-28): Enfield only — best agent coverage in the
  # audit (86%) and not previously backfilled. Other areas below stay disabled
  # until Enfield validates end-to-end; expand per docs/audit-progress.md.
  - name: enfield
    authority: Enfield
  - name: greenwich
    authority: Greenwich
  # Remaining agent-name boroughs from the audit (added 2026-09-29):
  - name: lambeth
    authority: Lambeth
  - name: lewisham
    authority: Lewisham
  - name: newham
    authority: Newham
  - name: southwark
    authority: Southwark
  - name: sutton
    authority: Sutton
  - name: tower-hamlets
    authority: Tower Hamlets
  # Islington enabled 2026-09-30 for 3-year backfill attempt (crawl fresh per audit,
  # agent names unusable — "See source" junk — so no agent-based filtering here).
  - name: islington
    authority: Islington
  - name: camden
    authority: Camden
  # Westminster enabled 2026-10-01 for 3y backfill (feed name is 'Westminster'
  # per audit alias; covers south Fitzrovia, Soho, Mayfair, Marylebone).
  - name: westminster
    authority: Westminster
  # - name: barnet
  #   authority: Barnet
  # - name: brent
  #   authority: Brent
  # - name: bexley
  #   authority: Bexley
  # - name: bromley
  #   authority: Bromley
  # - name: croydon
  #   authority: Croydon
  # - name: ealing
  #   authority: Ealing
  # - name: city-of-london
  #   authority: City

defaults:
  # States the spreadsheet treats as leads. "Conditions" = approved with
  # conditions (about a third of approvals — do NOT drop it).
  lead_states: [Permitted, Conditions]
  # States tracked in the ledger for future transitions to a lead state.
  watch_states: [Undecided]
  app_size: null                # Small | Medium | Large | null (all)
  keywords: null                # list of words, matched against description (any)
                                # e.g. ["discharge of condition"] flags imminent construction
  exclude_app_types: [Trees]    # tree works are never photography leads

backfill:
  enabled: true
  start_date: "2026-06-27"      # 3 months back; filters PlanIt start_date server-side,
                                # then decided_date client-side for the leads sheet

api:
  page_size: 100                # PlanIt is flaky below ~10; 100 keeps requests few
  delay_seconds: 5              # pacing between pages — PlanIt rate-limits (429)
  timeout_seconds: 120          #   aggressively; keep well under the radar
  max_retries: 6

output:
  leads_path: data/leads.xlsx   # spreadsheet of Permitted/Conditions
  ledger_path: data/ledger.sqlite
