[project]
name = "pam"
version = "0.1.0"
description = "Planning Application Monitor — PlanIt API lead tracker"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
]

[project.scripts]
pam = "pam.main:main"
pam-audit = "pam.audit:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pam*"]
